[project]
name = "user-service"
version = "0.1.0"
description = "Microservicio de usuarios: identidad y perfiles"
readme = "README.md"
authors = [
    { name = "vreniz", email = "vreniz@uninorte.edu.co" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.156.8",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
]
[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
